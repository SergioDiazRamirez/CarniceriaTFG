<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'LOGIN.LOGIN' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">{{ 'EMAIL' | translate }}</ion-label>
      <ion-input type="email" formControlName="email"></ion-input>
    </ion-item>
    <ion-note class="error-message" color="danger" *ngIf="email?.invalid && email?.touched">
      {{ "LOGIN.EMAIL_INVALID" | translate }}
    </ion-note>

    <ion-item>
      <ion-label position="floating">{{ 'PASSWORD' | translate }}</ion-label>
      <ion-input type="password" formControlName="password"></ion-input>
      <ion-icon name="eye"></ion-icon>
    </ion-item>
    <ion-note class="error-message" color="danger" *ngIf="password?.invalid && password?.touched">
      {{ "LOGIN.PASSWORD_REQUIRED" | translate }}
    </ion-note>

    <ion-button type="submit" expand="block" [disabled]="loginForm.invalid">
      {{ 'LOGIN.LOGIN' | translate }}
    </ion-button>
  </form>
  <div routerLink="/register" class="toRegister">
    {{ 'REGISTER.BUTTON' | translate}}
  </div>
</ion-content>
